# Publish the daily ledger anchor. This repository is public, so Actions minutes are free.
# The stats endpoint is public. The job uses only the built-in GITHUB_TOKEN.
name: Anchor

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anchor
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Write today's anchor (never overwrite)
        run: |
          set -euo pipefail
          day="$(date -u +%Y-%m-%d)"
          path="anchors/${day:0:4}/$day.json"
          if [ -e "$path" ]; then echo "$path already published"; exit 0; fi
          stats="$(curl -fsS --retry 3 --retry-delay 30 --max-time 20 https://api.tessovix.com/v1/tessovix/stats)"
          printf '%s' "$stats" | python3 -I -c 'import json,sys; d=json.load(sys.stdin)["ledgers"]; assert len(d["usage"]["tail_hash"]) == 64 and len(d["cp"]["tail_hash"]) == 64'
          mkdir -p "$(dirname "$path")"
          printf '%s\n' "$stats" > "$path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -q -m "anchor $day"
          git push -q
          echo "published $path"
